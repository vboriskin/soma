name: Deploy backend to VDS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
      # Frontend файлы — тоже триггерят деплой, потому что бэкенд их
      # раздаёт через nginx (см. deploy/build-frontend.sh → /opt/soma/frontend).
      - 'soma.html'
      - 'sw.js'
      - 'rituals.json'
      - 'manifest.webmanifest'
      - '*.svg'
  workflow_dispatch: {}        # ручной запуск из UI

jobs:
  deploy:
    name: SSH → docker compose up
    runs-on: ubuntu-latest
    concurrency:
      group: vds-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key:      ${{ secrets.VDS_SSH_KEY }}
          port:     22
          # Тайм-аут на всю сессию: build может занять 3–4 минуты.
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd /opt/soma
            bash deploy/deploy-vds.sh

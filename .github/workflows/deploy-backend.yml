name: Deploy backend to Fly

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}        # ручной запуск из UI (Actions → Run workflow)

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    concurrency:                # не запускаем параллельные деплои
      group: fly-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --config backend/fly.toml --dockerfile backend/Dockerfile ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

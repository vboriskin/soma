# SOMA — nginx reverse proxy + static frontend.
# Кладём в /etc/nginx/sites-available/soma и симлинкаем в sites-enabled.
# certbot подмешает 443-сервер и redirect 80→443 при первом запуске
# `certbot --nginx -d <hostname>`.
#
# Архитектура для альфы:
#   /          → статика (frontend) из /opt/soma/frontend
#   /api/*     → docker container на 127.0.0.1:8787
#   /auth/*    → docker container на 127.0.0.1:8787
#   /healthz   → docker container на 127.0.0.1:8787

server {
    listen 80;
    listen [::]:80;
    server_name 94-241-174-144.nip.io;

    server_tokens off;
    client_max_body_size 12M;
    access_log /var/log/nginx/soma-access.log combined buffer=8k flush=10s;
    error_log  /var/log/nginx/soma-error.log warn;

    # ----- Static frontend -----
    root /opt/soma/frontend;
    index index.html;

    # SPA fallback не нужен (single index.html), но 404 → index.html на всякий
    location / {
        try_files $uri $uri/ /index.html;
        # Index.html — не кешируем (нужно чтобы юзер сразу видел обновления)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        # Service worker — тоже не кешируем
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        # Картинки/иконки — на сутки
        location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
            add_header Cache-Control "public, max-age=86400";
        }
        # JSON (rituals, etc.) — на 5 минут
        location ~* \.json$ {
            add_header Cache-Control "public, max-age=300";
        }
    }

    # ----- Healthcheck (без access-логов чтобы не засорять) -----
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # ----- API + auth — proxy на бэкенд -----
    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # WebSocket support — для будущих long-poll фич
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ----- Security headers -----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

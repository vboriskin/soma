# SOMA — nginx reverse proxy.
# Кладём в /etc/nginx/sites-available/soma и симлинкаем в sites-enabled.
# certbot сам подмешает 443-сервер и redirect 80→443 при первом запуске
# `certbot --nginx -d <hostname>`.

server {
    listen 80;
    listen [::]:80;
    # Меняем при покупке домена. nip.io — wildcard-резолвер: имя вида
    # `<ip-with-dashes>.nip.io` авторазрешается в этот IP.
    server_name 94-241-174-144.nip.io;

    # Не отдаём заголовки версии nginx
    server_tokens off;

    # Body size — на /api/cache/save юзер шлёт base64-картинки до ~5 МБ.
    client_max_body_size 12M;

    # Логи — короткие, без referer (мусор) и user-agent (поменьше шума).
    access_log /var/log/nginx/soma-access.log combined buffer=8k flush=10s;
    error_log  /var/log/nginx/soma-error.log warn;

    # Healthcheck — пускаем без проксирования headers'ов клиента (уменьшает
    # шум в access-логе в момент UptimeRobot пингов).
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Всё остальное — проксируем на Express. Long-poll / SSE-friendly:
    # выключаем буферизацию, удлиняем таймауты на случай тяжёлого
    # headless-рендера (cosmos / pinterest).
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # WebSockets — для будущего firehose / live-sync. Сейчас не нужно,
        # но не навредит.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

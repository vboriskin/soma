# Fly.io конфиг для SOMA backend.
# Имя приложения и регион можно поменять — но имя должно совпадать с тем,
# что создал `fly launch` (или `fly apps create`).
#
# Сильно нагружаем CPU/RAM headless Chromium, поэтому стартуем на shared-1x
# с 1 ГБ RAM. Если будет тесно — поднимем до performance-1x.

app = "soma-backend"
primary_region = "fra"            # Frankfurt — близко и дёшево; меняй если хочешь

[build]
  # Dockerfile в этой же папке.

[env]
  NODE_ENV = "production"
  PORT = "8787"
  # Cloudflare Pages даёт тебе домен вида <branch>.<project>.pages.dev.
  # Этот список разрешённых origin'ов читается в server.js.
  # ВАЖНО: после привязки кастомного домена допиши его сюда (через запятую).
  ALLOWED_ORIGINS = "https://soma-frontend.pages.dev"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"     # экономия — машина гасится при простое
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Persistent volume для SQLite, cookies, кеша картинок. Создаётся один раз
# командой:
#   fly volumes create soma_data --region fra --size 3
[[mounts]]
  source = "soma_data"
  destination = "/data"
